buildscript {
    repositories {
        google()
        mavenCentral()  // jcenter() está obsoleto y cerrado
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

ext {
    roomVersion = '2.6.1'        // actualizado
    archLifecycleVersion = '2.7.0' // actualizado
}